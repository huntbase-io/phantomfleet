# How many rows each node "has" for a given table. Curated seed rows come first,
# then the population is padded with schema-generated rows up to a random count in
# [min, max]. Queries then view this population: WHERE filters it, count(*) counts
# it, LIMIT caps it. Tweak freely. Tables not listed use "default".

default: [1, 8]

# Singletons — exactly one row.
os_version: [1, 1]
system_info: [1, 1]
osquery_info: [1, 1]
kernel_info: [1, 1]
uptime: [1, 1]
system_controls: [1, 1]
time: [1, 1]

# Listing tables — realistic volume.
processes: [80, 240]
listening_ports: [10, 35]
process_open_sockets: [40, 160]
users: [6, 45]
groups: [20, 70]
logged_in_users: [1, 4]
