interface_details: [2, 6]
mounts: [4, 9]
logical_drives: [1, 1]
registry: [4, 12]
kernel_modules: [40, 160]
crontab: [3, 20]
deb_packages: [400, 1200]
rpm_packages: [300, 900]
apt_sources: [3, 12]
programs: [22, 28]
apps: [25, 120]
chrome_extensions: [3, 30]
firefox_addons: [2, 15]
browser_plugins: [3, 20]
startup_items: [5, 30]
