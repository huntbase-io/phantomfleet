# --- persistence ---
services:
  - name: "osqueryd"
    display_name: "osquery daemon service"
    status: "RUNNING"
    pid: "4812"
    start_type: "AUTO_START"
    path: "C:\\Program Files\\osquery\\osqueryd\\osqueryd.exe"
    service_type: "OWN_PROCESS"
    description: "osquery host monitoring daemon"
  - name: "Spooler"
    display_name: "Print Spooler"
    status: "RUNNING"
    pid: "1820"
    start_type: "AUTO_START"
    path: "C:\\Windows\\System32\\spoolsv.exe"
    service_type: "OWN_PROCESS"
  - name: "WinDefend"
    display_name: "Microsoft Defender Antivirus Service"
    status: "RUNNING"
    pid: "3120"
    start_type: "AUTO_START"
    path: "C:\\ProgramData\\Microsoft\\Windows Defender\\Platform\\MsMpEng.exe"
  # Patterned template for the rest of the service list.
  - name: "{{choice:WSearch|Themes|Dnscache|LanmanServer|EventLog|Schedule|BITS|wuauserv|Dhcp|W32Time}}"
    display_name: "{{words}}"
    status: "{{choice:RUNNING|STOPPED}}"
    pid: "{{int:400..9000}}"
    start_type: "{{choice:AUTO_START|DEMAND_START|DISABLED}}"
    path: "C:\\Windows\\System32\\svchost.exe -k {{word}}"
    service_type: "SHARE_PROCESS"

scheduled_tasks:
  - name: "GoogleUpdateTaskMachineUA"
    action: "C:\\Program Files (x86)\\Google\\Update\\GoogleUpdate.exe /ua /installsource scheduler"
    path: "\\GoogleUpdateTaskMachineUA"
    enabled: "1"
    state: "ready"
    last_run_time: "1716100000"
    next_run_time: "1716186400"
    hidden: "0"
  - name: "UpdaterTask"
    action: "C:\\Users\\{{username}}\\AppData\\Roaming\\.cache\\svc.exe"
    path: "\\UpdaterTask"
    enabled: "1"
    state: "ready"
    hidden: "1"
  # Patterned template for the bulk of scheduled tasks.
  - name: "{{choice:OneDriveStandaloneUpdater|MicrosoftEdgeUpdateTaskMachine|Office Automatic Updates|Adobe Acrobat Update|.NET Framework NGEN}}"
    action: "C:\\Program Files\\{{word}}\\{{word}}.exe"
    path: "\\Microsoft\\Windows\\{{word}}"
    enabled: "{{bool}}"
    state: "{{choice:ready|running|disabled}}"
    last_run_time: "{{unixtime}}"
    next_run_time: "{{unixtime}}"
    hidden: "{{bool}}"

startup_items:
