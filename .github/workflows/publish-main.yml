name: Publish main image

# Every push to main publishes a container image, so deployments can pin an
# exact build between releases:
#   ghcr.io/huntbase-io/phantomfleet:main          (moves with main)
#   ghcr.io/huntbase-io/phantomfleet:sha-<short>   (immutable)
# Tagged releases are published by release.yml.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  image:
    name: Container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git describe for the version string
      - name: Version
        id: version
        run: echo "version=$(git describe --tags --always)-main" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/huntbase-io/phantomfleet
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-
          flavor: |
            latest=false
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
      - name: Smoke test
        run: docker run --rm "ghcr.io/huntbase-io/phantomfleet@${{ steps.build.outputs.digest }}" --version
      - name: Summary
        run: |
          {
            echo "### ghcr.io/huntbase-io/phantomfleet"
            echo
            echo "- version: \`${{ steps.version.outputs.version }}\`"
            echo "- digest: \`${{ steps.build.outputs.digest }}\`"
            echo '- tags:'
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
