# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: phantomfleet

before:
  hooks:
    - go test ./...
    # Licence and notice files of every linked module, shipped in each archive.
    - sh scripts/third-party-licenses.sh THIRD_PARTY_LICENSES

builds:
  - id: phantomfleet
    binary: phantomfleet
    main: .
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - NOTICE
      - README.md
      - THIRD_PARTY_LICENSES/*
      - THIRD_PARTY_LICENSES/**/*
      - src: examples/**/*
        dst: examples

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore\\(deps\\):"
      - "Merge pull request"
      - "Merge branch"
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Other
      order: 999

release:
  github:
    owner: huntbase-io
    name: phantomfleet
  prerelease: auto
  footer: |
    Container image: `ghcr.io/huntbase-io/phantomfleet:{{ .Tag }}`
