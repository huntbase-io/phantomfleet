# Row catalogs for {{row:<catalog>.<field>}} seed tokens. Each entry is one
# coherent record: every row: token of a seed row reads the same entry.
example_linux_services:
  - {name: cron, path: /usr/sbin/cron, cmdline: /usr/sbin/cron -f, uid: "0"}
  - {name: rsyslogd, path: /usr/sbin/rsyslogd, cmdline: /usr/sbin/rsyslogd -n -iNONE, uid: "104"}
  - {name: sshd, path: /usr/sbin/sshd, cmdline: "sshd: /usr/sbin/sshd -D [listener] 0 of 10-100 startups", uid: "0"}
  - {name: systemd-journald, path: /usr/lib/systemd/systemd-journald, cmdline: /lib/systemd/systemd-journald, uid: "0"}
  - {name: dbus-daemon, path: /usr/bin/dbus-daemon, cmdline: "@dbus-daemon --system --address=systemd: --nofork --nopidfile --systemd-activation --syslog-only", uid: "102"}
  - {name: nginx, path: /usr/sbin/nginx, cmdline: "nginx: master process /usr/sbin/nginx -g daemon on; master_process on;", uid: "0"}
