# Example Corp: a fictional 15-host estate used as phantomfleet's sample fleet.
#
# Every node's identity is pinned: the uuid_seed + namespace give each host the
# same osquery UUID on every run, so the server sees the same endpoints (and
# keeps their tags) across restarts.
#
#   phantomfleet --nodes-file examples/examplecorp/nodes.yaml \
#                --seeds-dir examples/examplecorp/seeds ...
#
# The PAN-OS appliances are enrolled as nodes too (platform "panos" answers from
# the linux seed profile), so the vulnerable firewall shows up in the fleet.

