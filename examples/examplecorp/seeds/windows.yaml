# Example Corp Windows hosts: dc-01, file-srv-01, finance-ws-12/13, hr-ws-03,
# sales-ws-21. Layered over the built-in windows profile (--seeds-dir).
#
# Rows with `_hosts` are reported only by the hosts named there. Times use
# {{ago:DURATION}}: story events keep the same age relative to query time, so
# the scenario always looks recent no matter when the fleet was started.
#
# S1 "Driver in the finance wing" on finance-ws-12 (a.harper):
#   Invoice_0921.zip -> Invoice_0921.lnk -> powershell -enc (download a.bin from
#   update.example-c2.test to %TEMP%\rtc.sys) -> RTCore64 kernel driver service
#   (MSI Afterburner, LOLDrivers) -> WinDefend / Sense / WdNisSvc stopped ->
#   SMB logon to file-srv-01 -> blocked bulk rename of \\file-srv-01\finance.

