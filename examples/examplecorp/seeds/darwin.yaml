# Example Corp macOS hosts: eng-ws-07 (m.delgado), eng-ws-22 (r.okonkwo).
# Layered over the built-in darwin profile (--seeds-dir). Rows with `_hosts` are
# reported only by the hosts named there.
#
# Vulnerable inventory: Google Chrome 116.0.5845.96 bundles a libwebp affected by
# CVE-2023-4863 (fixed in 116.0.5845.187); Homebrew webp 1.3.1 likewise
# (fixed in 1.3.2).

apps:
  - _hosts: eng-ws-07|eng-ws-22
    _key: bundle_identifier
    name: Google Chrome.app
    path: /Applications/Google Chrome.app
    bundle_identifier: com.google.Chrome
    bundle_name: Google Chrome
    bundle_short_version: 116.0.5845.96
    bundle_version: 5845.96
    display_name: Google Chrome
  - _hosts: eng-ws-07|eng-ws-22
    name: Visual Studio Code.app
    path: /Applications/Visual Studio Code.app
    bundle_identifier: com.microsoft.VSCode
    bundle_name: Code
    bundle_short_version: 1.92.2
    display_name: Visual Studio Code
  - _hosts: eng-ws-07|eng-ws-22
    name: Falcon.app
    path: /Applications/Falcon.app
    bundle_identifier: com.crowdstrike.falcon.App
    bundle_name: Falcon
    bundle_short_version: 7.16.18605.0
    display_name: Falcon

homebrew_packages:
  - _hosts: eng-ws-07|eng-ws-22
    name: webp
    path: /opt/homebrew/Cellar/webp/1.3.1
    version: 1.3.1
    type: formula
    prefix: /opt/homebrew
  - _hosts: eng-ws-07|eng-ws-22
    name: node
    path: /opt/homebrew/Cellar/node/20.5.0
    version: 20.5.0
    type: formula
    prefix: /opt/homebrew
  - _hosts: eng-ws-22
    name: awscli
    path: /opt/homebrew/Cellar/awscli/2.17.18
    version: 2.17.18
    type: formula
    prefix: /opt/homebrew

