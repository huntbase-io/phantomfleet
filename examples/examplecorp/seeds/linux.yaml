    directory: /home/svc_deploy/.aws
    filename: credentials
    size: "116"
    type: regular
    uid: "1001"
    mode: "0600"
    mtime: "{{ago:2000h}}"

processes:
  - _hosts: web-prod-01|web-prod-02
    pid: "1290"
    parent: "1"
    name: nginx
    path: /usr/sbin/nginx
    cmdline: "nginx: master process /usr/sbin/nginx -g daemon on; master_process on;"
    state: S
    uid: "0"
  - _hosts: web-prod-01
    pid: "1422"
    parent: "1"
    name: java
    path: /usr/lib/jvm/java-11-openjdk-amd64/bin/java
    cmdline: java -Xmx2g -jar /opt/payment-portal/payment-portal.jar --server.port=8080
    cwd: /opt/payment-portal
    state: S
    uid: "1002"
  - _hosts: db-primary
    pid: "905"
    parent: "1"
    name: postgres
    path: /usr/lib/postgresql/14/bin/postgres
    cmdline: /usr/lib/postgresql/14/bin/postgres -D /var/lib/postgresql/14/main -c config_file=/etc/postgresql/14/main/postgresql.conf
    state: S
    uid: "113"
  - _hosts: build-runner-03
    pid: "1310"
    parent: "1"
    name: Runner.Listener
    path: /home/svc_deploy/actions-runner/bin/Runner.Listener
    cmdline: /home/svc_deploy/actions-runner/bin/Runner.Listener run --startuptype service
    cwd: /home/svc_deploy/actions-runner
    state: S
    uid: "1001"
  - _hosts: fw-edge-01|vpn-gw-01
    pid: "2231"
    parent: "1"
    name: gpsvc
    path: /usr/local/bin/gpsvc
    cmdline: /usr/local/bin/gpsvc -portal -gateway
    state: S
    uid: "0"

