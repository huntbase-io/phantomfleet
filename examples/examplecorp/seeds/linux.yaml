# Example Corp Linux hosts (and the PAN-OS appliances, which answer from the
# linux profile): web-prod-01/02, db-primary, build-runner-03, jump-01,
# fw-edge-01, vpn-gw-01. Layered over the built-in linux profile (--seeds-dir).
# Rows with `_hosts` are reported only by the hosts named there.
#
# Vulnerable inventory the story leans on:
#   web-prod-01  log4j-core 2.14.1 in the payment portal (CVE-2021-44228),
#                nginx 1.24.0 (CVE-2023-44487)
#   fw-edge-01 / vpn-gw-01  PAN-OS 11.1.0 GlobalProtect (CVE-2024-3400, KEV) —
#                the OS version itself comes from the nodes file.

deb_packages:
  - _hosts: web-prod-01|web-prod-02
    name: nginx
    version: 1.24.0-1~jammy
    source: nginx
    arch: amd64
    revision: 1~jammy
    status: install ok installed
    maintainer: NGINX Packaging <nginx-packaging@f5.com>
    section: httpd
    priority: optional
  - _hosts: web-prod-01
    name: liblog4j2-java
    version: 2.14.1-1
    source: apache-log4j2
    arch: all
    revision: "1"
    status: install ok installed
    maintainer: Debian Java Maintainers <pkg-java-maintainers@lists.alioth.debian.org>
    section: java
    priority: optional
  - _hosts: web-prod-01|web-prod-02
    name: openjdk-11-jre-headless
    version: 11.0.24+8-1ubuntu3~22.04
    source: openjdk-lts
    arch: amd64
    status: install ok installed
    section: java
    priority: optional
  - _hosts: db-primary
    name: postgresql-14
    version: 14.13-0ubuntu0.22.04.1
    source: postgresql-14
    arch: amd64
    status: install ok installed
    section: database
    priority: optional

